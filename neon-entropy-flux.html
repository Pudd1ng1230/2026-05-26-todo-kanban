<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霓虹熵流 — Neon Entropy Flux</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --sidebar-bg: #0a0a0a;
      --border: #1f1f1f;
      --text: #c0c0c0;
      --text-muted: #777;
      --orange: #ff5e00;
      --orange-bright: #ff8c3a;
      --orange-glow: rgba(255, 94, 0, 0.2);
      --radius: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
    }

    /* ── Sidebar ── */
    aside {
      width: 280px;
      min-width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 18px;
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 0.5px;
    }

    .sidebar-header p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section {
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--orange-bright);
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* ── Seed ── */
    .seed-display {
      font-size: 28px;
      font-weight: 700;
      font-family: 'Consolas', 'Courier New', monospace;
      color: var(--orange);
      text-align: center;
      margin: 4px 0;
      text-shadow: 0 0 20px var(--orange-glow);
    }

    .seed-buttons {
      display: flex;
      gap: 4px;
    }

    .seed-buttons button {
      flex: 1;
      padding: 6px 0;
      font-size: 11px;
      border: 1px solid var(--border);
      background: #111;
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .seed-buttons button:hover {
      border-color: var(--orange);
      color: var(--orange);
      background: #1a1a1a;
    }

    .seed-jump {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .seed-jump input {
      flex: 1;
      padding: 5px 8px;
      background: #111;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-size: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      outline: none;
      width: 0;
    }

    .seed-jump input:focus {
      border-color: var(--orange);
    }

    .seed-jump button {
      padding: 5px 10px;
      background: #111;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }

    .seed-jump button:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    /* ── Parameters ── */
    .control-group {
      margin-bottom: 10px;
    }

    .control-group:last-child { margin-bottom: 0; }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .control-group label .val {
      color: var(--orange-bright);
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .control-group input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--orange);
      cursor: pointer;
      box-shadow: 0 0 8px var(--orange-glow);
    }

    /* ── Colors section ── */
    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-row input[type="color"] {
      -webkit-appearance: none;
      width: 32px;
      height: 24px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .color-row input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-row input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 3px;
    }

    .color-row span {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
      text-align: center;
    }

    .btn-orange {
      background: var(--orange);
      color: #000;
      border-color: var(--orange);
      font-weight: 700;
    }

    .btn-orange:hover {
      background: var(--orange-bright);
      box-shadow: 0 0 16px var(--orange-glow);
    }

    .btn-ghost {
      background: #111;
      color: var(--text);
    }

    .btn-ghost:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    /* ── Main Canvas Area ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0d0d0d 0%, #000000 70%);
      position: relative;
    }

    #canvas-container {
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
    }

    #canvas-container canvas {
      display: block;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      body { flex-direction: column; }
      aside {
        width: 100%;
        min-width: unset;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
        overflow-y: visible;
        max-height: 200px;
      }
      aside .section { flex: 1; min-width: 140px; }
      .sidebar-header { width: 100%; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="sidebar-header">
      <h1>霓虹熵流</h1>
      <p>Neon Entropy Flux &mdash; Algorithmic Art</p>
    </div>

    <!-- 1. Seed (FIXED) -->
    <div class="section">
      <div class="section-title">Seed</div>
      <div class="seed-display" id="seed-display">1</div>
      <div class="seed-buttons">
        <button onclick="prevSeed()" title="Previous">&#9664; Prev</button>
        <button onclick="randomSeedAction()" title="Random">&#9733; Random</button>
        <button onclick="nextSeed()" title="Next">Next &#9654;</button>
      </div>
      <div class="seed-jump">
        <input type="number" id="seed-input" placeholder="Jump to seed..." onkeydown="if(event.key==='Enter')jumpToSeed()">
        <button onclick="jumpToSeed()">Go</button>
      </div>
    </div>

    <!-- 2. Parameters (VARIABLE) -->
    <div class="section">
      <div class="section-title">Parameters</div>

      <div class="control-group">
        <label>粒子数量 <span class="val" id="val-count">2000</span></label>
        <input type="range" id="param-count" min="300" max="4000" step="50" value="2000" oninput="updateParam('count', this.value)">
      </div>

      <div class="control-group">
        <label>噪声缩放 <span class="val" id="val-noise">0.004</span></label>
        <input type="range" id="param-noise" min="0.001" max="0.015" step="0.0005" value="0.004" oninput="updateParam('noise', this.value)">
      </div>

      <div class="control-group">
        <label>流动速度 <span class="val" id="val-speed">1.8</span></label>
        <input type="range" id="param-speed" min="0.5" max="4" step="0.1" value="1.8" oninput="updateParam('speed', this.value)">
      </div>

      <div class="control-group">
        <label>尾迹衰减 <span class="val" id="val-fade">12</span></label>
        <input type="range" id="param-fade" min="2" max="40" step="1" value="12" oninput="updateParam('fade', this.value)">
      </div>

      <div class="control-group">
        <label>旋度强度 <span class="val" id="val-curl">4</span></label>
        <input type="range" id="param-curl" min="1" max="8" step="0.5" value="4" oninput="updateParam('curl', this.value)">
      </div>

      <div class="control-group">
        <label>色温偏移 <span class="val" id="val-hue">25</span></label>
        <input type="range" id="param-hue" min="10" max="50" step="1" value="25" oninput="updateParam('hue', this.value)">
      </div>
    </div>

    <!-- 3. Colors (VARIABLE) -->
    <div class="section">
      <div class="section-title">Colors</div>
      <div class="color-row">
        <input type="color" id="color-primary" value="#ff5e00" onchange="updateColor()">
        <span>Primary</span>
      </div>
      <div class="color-row" style="margin-top:6px;">
        <input type="color" id="color-accent" value="#ffb800" onchange="updateColor()">
        <span>Accent</span>
      </div>
    </div>

    <!-- 4. Actions (FIXED) -->
    <div class="section">
      <div class="section-title">Actions</div>
      <div class="actions">
        <button class="btn btn-orange" onclick="regenerate()">Regenerate</button>
        <button class="btn btn-ghost" onclick="resetParams()">Reset</button>
        <button class="btn btn-ghost" onclick="downloadPNG()">Download PNG</button>
      </div>
    </div>
  </aside>

  <main>
    <div id="canvas-container"></div>
  </main>

  <script>
    // ─── GLOBAL STATE ───
    let seed = 1;
    let params = {
      count: 2000,
      noise: 0.004,
      speed: 1.8,
      fade: 12,
      curl: 4,
      hue: 25,
    };
    let primaryColor = '#ff5e00';
    let accentColor = '#ffb800';
    let particles = [];
    let noiseZ = 0;

    // ─── SEED FUNCTIONS ───
    function prevSeed() {
      seed = Math.max(1, seed - 1);
      document.getElementById('seed-display').textContent = seed;
      document.getElementById('seed-input').value = seed;
      resetSketch();
    }

    function nextSeed() {
      seed += 1;
      document.getElementById('seed-display').textContent = seed;
      document.getElementById('seed-input').value = seed;
      resetSketch();
    }

    function randomSeedAction() {
      seed = Math.floor(Math.random() * 99999) + 1;
      document.getElementById('seed-display').textContent = seed;
      document.getElementById('seed-input').value = seed;
      resetSketch();
    }

    function jumpToSeed() {
      const val = parseInt(document.getElementById('seed-input').value);
      if (!isNaN(val) && val > 0) {
        seed = val;
        document.getElementById('seed-display').textContent = seed;
        resetSketch();
      }
    }

    // ─── PARAMETER FUNCTIONS ───
    function updateParam(key, value) {
      params[key] = parseFloat(value);
      document.getElementById('val-' + key).textContent = value;
      if (key === 'count') {
        resetSketch();
      }
    }

    function updateColor() {
      primaryColor = document.getElementById('color-primary').value;
      accentColor = document.getElementById('color-accent').value;
    }

    function resetParams() {
      params = {
        count: 2000,
        noise: 0.004,
        speed: 1.8,
        fade: 12,
        curl: 4,
        hue: 25,
      };
      document.getElementById('param-count').value = 2000;
      document.getElementById('param-noise').value = 0.004;
      document.getElementById('param-speed').value = 1.8;
      document.getElementById('param-fade').value = 12;
      document.getElementById('param-curl').value = 4;
      document.getElementById('param-hue').value = 25;
      document.getElementById('val-count').textContent = '2000';
      document.getElementById('val-noise').textContent = '0.004';
      document.getElementById('val-speed').textContent = '1.8';
      document.getElementById('val-fade').textContent = '12';
      document.getElementById('val-curl').textContent = '4';
      document.getElementById('val-hue').textContent = '25';
      primaryColor = '#ff5e00';
      accentColor = '#ffb800';
      document.getElementById('color-primary').value = '#ff5e00';
      document.getElementById('color-accent').value = '#ffb800';
      resetSketch();
    }

    function regenerate() {
      seed = Math.floor(Math.random() * 99999) + 1;
      document.getElementById('seed-display').textContent = seed;
      document.getElementById('seed-input').value = seed;
      resetSketch();
    }

    function downloadPNG() {
      saveCanvas('neon-entropy-flux-' + seed);
    }

    function resetSketch() {
      noiseZ = 0;
      initParticles();
    }

    function initParticles() {
      randomSeed(seed);
      noiseSeed(seed);
      particles = [];
      for (let i = 0; i < params.count; i++) {
        particles.push({
          x: random(width),
          y: random(height),
          vx: 0,
          vy: 0,
        });
      }
      // Clear canvas
      background(0);
    }

    // ─── P5.JS SKETCH ───
    function setup() {
      const container = document.getElementById('canvas-container');
      const size = Math.min(container.parentElement.clientWidth - 40, container.parentElement.clientHeight - 20, 800);
      const canvas = createCanvas(size, size);
      canvas.parent('canvas-container');
      colorMode(HSB, 360, 255, 255, 255);
      pixelDensity(1);

      document.getElementById('seed-display').textContent = seed;
      document.getElementById('seed-input').value = seed;
      initParticles();
    }

    function draw() {
      // Trail fade: semi-transparent black overlay
      blendMode(BLEND);
      noStroke();
      fill(0, params.fade);
      rect(0, 0, width, height);

      // Draw particles with additive blending for neon glow
      blendMode(ADD);

      const { noise: noiseScale, speed, curl: curlStrength, hue: hueBase } = params;

      for (let p of particles) {
        // Flow field angle from Perlin noise
        const angle = noise(p.x * noiseScale, p.y * noiseScale, noiseZ) * TWO_PI * curlStrength;

        // Apply force
        p.vx += cos(angle) * 0.15;
        p.vy += sin(angle) * 0.15;

        // Speed limit
        const spd = sqrt(p.vx * p.vx + p.vy * p.vy);
        const maxSpd = speed;
        if (spd > maxSpd) {
          p.vx *= maxSpd / spd;
          p.vy *= maxSpd / spd;
        }

        // Update position
        p.x += p.vx;
        p.y += p.vy;

        // Wrap around edges
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        // Color: velocity → hue (orange spectrum), brightness
        const spdNorm = spd / maxSpd;
        const hue = map(spdNorm, 0, 1, hueBase + 10, hueBase - 5);  // slower = warmer, faster = whiter
        const saturation = map(spdNorm, 0, 1, 220, 80);
        const brightness = map(spdNorm, 0, 1, 120, 255);

        // Glow: draw outer halo + bright core
        noStroke();

        // Outer glow
        fill(hue, saturation, brightness, 12);
        ellipse(p.x, p.y, 6, 6);

        // Core
        fill(hue, saturation * 0.6, brightness, 40);
        ellipse(p.x, p.y, 2.5, 2.5);
      }

      // Slowly evolve noise space for subtle animation
      noiseZ += 0.0003;
    }

    function windowResized() {
      const container = document.getElementById('canvas-container');
      const size = Math.min(container.parentElement.clientWidth - 40, container.parentElement.clientHeight - 20, 800);
      resizeCanvas(size, size);
      randomSeed(seed);
      noiseSeed(seed);
      initParticles();
    }
  </script>
</body>
</html>
